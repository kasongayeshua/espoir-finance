<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12355b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ESPOIR Finance</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#14213d;--mut:#667085;--btn:#12355b;--bi:#fff;--acc:#f5b800;--red:#c8102e;--ok:#1b7f4b;--line:#e3dfd3}
@media(prefers-color-scheme:dark){:root{--bg:#0e1726;--card:#16233a;--ink:#eef1f6;--mut:#9aa7bd;--btn:#f5b800;--bi:#14213d;--line:#263757}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--btn);color:var(--bi);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:19px}
header button{background:transparent;color:var(--bi);border:1.5px solid var(--bi);border-radius:20px;padding:5px 14px;font-weight:700}
main{max-width:620px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}
.big{font-size:30px;font-weight:800;margin:2px 0}
.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{border-left:5px solid var(--acc);padding-left:10px}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;font-size:16px;background:var(--bg);color:var(--ink)}
button.b{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--btn);color:var(--bi);font-size:16px;font-weight:700}
button.s{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.al{border-left:5px solid var(--acc);background:var(--card);padding:10px 12px;margin-bottom:8px;border-radius:8px;border:1px solid var(--line);border-left:5px solid var(--acc)}
.al.r{border-left-color:var(--red)}
.neg{color:var(--red)}.pos{color:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0;color:var(--mut);font-size:10.5px;font-weight:600}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
nav span{display:block;font-size:18px}
#t{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;display:none;z-index:9;max-width:90%}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:flex-end;justify-content:center}
.mb{background:var(--card);width:100%;max-width:620px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
textarea{width:100%;height:70px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:12px}
</style>
</head>
<body>
<header><b id="ttl">ESPOIR Finance</b><span><button onclick="lock()">🔒</button> <button id="cur" onclick="swap()">FC</button></span></header>
<main id="app"></main>
<div id="t"></div>
<div id="md"></div>
<nav id="nav"></nav>
<script>
var DP=null,CU=null,LK={n:0,t:0},idle,MD=null,S,tab='home',cart=[],D=864e5,KEY='espoir_v03';
function init(){return{taux:2800,dev:'FC',acc:[{id:'a1',nom:'Caisse',cur:'FC'},{id:'a2',nom:'Caisse',cur:'USD'},{id:'a3',nom:'Mobile Money',cur:'FC'}],p:[],v:[],mv:[],biz:null,fr:[],ac:[],sm:[],us:[],au:[],cl:[],od:[]}}
function norm(){S.od=S.od||[];S.us=S.us||[];S.au=S.au||[];S.cl=S.cl||[];S.fr=S.fr||[];S.ac=S.ac||[];S.sm=S.sm||[]}
function db(m,f){try{var r=indexedDB.open('espoir_v03',1);r.onupgradeneeded=function(){r.result.createObjectStore('k')};r.onsuccess=function(){f(r.result.transaction('k',m).objectStore('k'))};r.onerror=function(){f(null)}}catch(e){f(null)}}
function save(){if(L)saveL();var j=JSON.stringify(S);db('readwrite',function(s){if(s)s.put(j,'s')});try{localStorage.setItem(KEY,j)}catch(e){}}
function fin(j){try{S=j?JSON.parse(j):init();if(!S.mv)S=init();norm()}catch(e){S=init()}loadL(function(l){L=l;saveL();R()});if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
function start(){var ls=localStorage.getItem(KEY);db('readonly',function(s){if(!s)return fin(ls);var g=s.get('s');g.onsuccess=function(){fin(g.result||ls)};g.onerror=function(){fin(ls)}})}
function $(i){return document.getElementById(i)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function isToday(t){return new Date(t).toDateString()===new Date().toDateString()}
function fa(m,c){return c==='USD'?(m<0?'-':'')+'$'+Math.abs(m).toLocaleString('fr-FR',{maximumFractionDigits:2}):Math.round(m).toLocaleString('fr-FR')+' FC'}
function fmt(n){return S.dev==='USD'?fa(n/S.taux,'USD'):fa(n,'FC')}
function toFC(x){return S.dev==='USD'?x*S.taux:x}
function dp(n){return S.dev==='USD'?Math.round(n/S.taux*100)/100:Math.round(n)}
function tc(n,c){return c==='USD'?Math.round(n/S.taux*100)/100:Math.round(n)}
function num(id){return parseFloat(String($(id).value||'').replace(',','.'))}
function toast(m){var t=$('t');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2400)}
function swap(){S.dev=S.dev==='FC'?'USD':'FC';save();R()}
function go(t){tab=t;R();window.scrollTo(0,0)}
function acc(id){return S.acc.find(function(a){return a.id===id})}
function lab(a){return a.nom+' ('+a.cur+')'}
function fc(e){return e.cur==='USD'?e.m*e.taux:e.m}
function bal(a){return S.mv.reduce(function(s,e){return e.acc===a.id?s+e.m:s},0)}
function kind(e){return e.type==='annul'?e.of:e.type}
function post(type,a,m,ref,note){S.mv.push({u:CU?CU.nom:'',id:uid(),t:Date.now(),type:type,acc:a,cur:acc(a).cur,m:m,taux:S.taux,ref:ref||'',note:note||''})}
function paid(v){return S.mv.reduce(function(s,e){return((e.ref===v.id&&kind(e)==='enc')||(v.ord&&e.ref===v.ord&&kind(e)==='aco'))?s+fc(e):s},0)}
function due(v){return v.annul?0:Math.max(0,v.total-paid(v))}
function opts(){return S.acc.map(function(a){return'<option value="'+a.id+'">'+esc(lab(a))+'</option>'}).join('')}
function cartTot(){return cart.reduce(function(a,i){return a+i.prix*i.qte},0)}
var TYP={'Boutique':'nego','Alimentation':'nego','Pharmacie':'fixe','Quincaillerie':'nego','Habillement':'nego','Restaurant':'fixe','Hôtel':'fixe','Briqueterie':'nego','Autre':'nego'};
var ML={fixe:'Prix fixe',nego:'Prix négociable',libre:'Prix libre'};
function pol(p){var b=S.biz||{mode:'nego',max:10},m=p.mode&&p.mode!=='defaut'?p.mode:b.mode,mn=p.min>0?p.min:p.vente*(1-(b.max||0)/100);return{mode:m,min:m==='nego'?mn:m==='libre'?0:p.vente}}
function hint(p){var q=pol(p);return q.mode==='fixe'?'Prix fixe : non modifiable.':q.mode==='libre'?'Prix libre : vous fixez le prix.':'Négociable : minimum '+fmt(q.min)+'. En dessous, un motif est exigé.'}
function plab(p){var q=pol(p);return q.mode==='fixe'?'Prix fixe':q.mode==='libre'?'Prix libre':'Négociable (min '+fmt(q.min)+')'}
function stockCard(){
  var c=0,v=0,n=0;S.p.forEach(function(p){var q=Math.max(p.qte,0);c+=q*p.cout;v+=q*p.vente;if(q>0)n++});
  return'<div class="card"><h2>Valeur du stock</h2><div class="grid"><div class="k"><div class="mut">Au coût d\u2019achat</div><b>'+fmt(c)+'</b></div><div class="k"><div class="mut">Au prix de vente</div><b>'+fmt(v)+'</b></div></div><p class="mut" style="margin:10px 0 0">Marge potentielle : <b>'+fmt(v-c)+'</b> sur '+n+' produit(s) en stock.</p></div>';
}
function vBiz(){
  var b=S.biz||{nom:'',type:'Boutique',resp:'',tel:'',adr:'',mode:'nego',max:10},f=!S.biz;
  return'<div class="card"><h2>'+(f?'Bienvenue sur ESPOIR Finance':'Mon activité')+'</h2>'+(f?'<p class="mut">Enregistrez votre activité pour commencer.</p>':'')+
  '<label>Nom de l\u2019établissement</label><input id="bn" value="'+esc(b.nom)+'"><label>Type d\u2019activité</label><select id="bt" onchange="bizType()">'+Object.keys(TYP).map(function(k){return'<option'+(k===b.type?' selected':'')+'>'+k+'</option>'}).join('')+'</select>'+
  '<label>Propriétaire / gérant</label><input id="br" value="'+esc(b.resp)+'"><label>Téléphone</label><input id="bph" type="tel" value="'+esc(b.tel)+'"><label>Adresse (commune, quartier)</label><input id="ba" value="'+esc(b.adr)+'">'+
  '<label>Politique de prix par défaut</label><select id="bm" onchange="bizType(1)">'+Object.keys(ML).map(function(k){return'<option value="'+k+'"'+(k===b.mode?' selected':'')+'>'+ML[k]+'</option>'}).join('')+'</select>'+
  '<div id="bxv"><label>Remise maximale autorisée (%)</label><input id="bx" type="number" inputmode="decimal" value="'+b.max+'"></div><p class="mut">Vous pourrez fixer une politique différente pour chaque produit.</p><button class="b" onclick="saveBiz()">'+(f?'Commencer':'Enregistrer')+'</button></div>';
}
function bizType(k){if(!k)$('bm').value=TYP[$('bt').value];$('bxv').style.display=$('bm').value==='nego'?'block':'none'}
function saveBiz(){
  var n=$('bn').value.trim();if(!n)return toast('Entrez le nom de l\u2019établissement');
  S.biz={nom:n,type:$('bt').value,resp:$('br').value.trim(),tel:$('bph').value.trim(),adr:$('ba').value.trim(),mode:$('bm').value,max:Math.min(100,Math.max(0,num('bx')||0))};
  aud('Activité enregistrée',n);save();toast('Activité enregistrée');tab='home';R();
}
function bizCard(){var b=S.biz;return'<div class="card"><h2>Mon activité</h2><b>'+esc(b.nom)+'</b><div class="mut">'+esc(b.type)+(b.resp?' \u2022 '+esc(b.resp):'')+(b.tel?' \u2022 '+esc(b.tel):'')+(b.adr?'<br>'+esc(b.adr):'')+'<br>Prix par défaut : '+ML[b.mode]+(b.mode==='nego'?' (remise max '+b.max+' %)':'')+'</div><button class="b" onclick="go(\'biz\')">Modifier l\u2019activité</button></div>'}
function alertes(){
  var a=[],now=Date.now();
  function sum(x,y){return S.v.filter(function(v){return !v.annul&&v.t>now-y*D&&v.t<=now-x*D}).reduce(function(s,v){return s+v.total},0)}
  var w=sum(0,7),avg=sum(7,35)/4;
  if(avg>0&&w<avg*0.85)a.push(['Indicateur : les ventes de la semaine sont inférieures de '+Math.round((1-w/avg)*100)+' % à la moyenne des 4 semaines précédentes.',1]);
  S.p.forEach(function(p){
    var q=0;S.v.forEach(function(v){if(!v.annul&&v.t>now-14*D)v.items.forEach(function(i){if(i.pid===p.id)q+=i.qte})});
    var r=q/14,n=esc(p.nom),pc=fmt(Math.ceil(p.cout*1.25/50)*50);
    if(p.qte<0)a.push(['Stock négatif : '+n+' ('+p.qte+'). Vérifiez les entrées ou faites un inventaire.',1]);
    else if(p.qte===0)a.push(['Rupture : '+n+' est épuisé.',1]);
    else if(r>0&&p.qte/r<=3)a.push(['Au rythme actuel, le stock de '+n+' durera environ '+Math.max(1,Math.round(p.qte/r))+' jour(s).',1]);
    else if(p.qte<=p.seuil)a.push(['Stock bas : '+n+' ('+p.qte+' restant).',0]);
    if(p.vente<=p.cout)a.push([n+' est vendu au prix coûtant ou à perte. Prix conseillé : '+pc+'.',1]);
    else if((p.vente-p.cout)/p.vente<0.1)a.push(['Marque inférieure à 10 % sur '+n+'. Prix conseillé : '+pc+'.',0]);
  });
  S.od.forEach(function(o){if(o.st==='en'&&o.liv&&new Date(o.liv).getTime()+D<now)a.push(['Commande en retard : '+esc(o.client)+', livraison prévue le '+new Date(o.liv).toLocaleDateString('fr-FR')+'.',1])});
  S.v.forEach(function(v){if(due(v)>=1&&now-v.t>7*D)a.push(['Créance en retard : '+esc(v.client)+' doit encore '+fmt(due(v))+' (plus de 7 jours).',0])});
  var pw=0;S.sm.forEach(function(m){if(m.t>now-7*D&&isLoss(m))pw+=lossVal(m)});
  if(pw>0){var sv=S.p.reduce(function(x,q){return x+Math.max(q.qte,0)*q.cout},0);a.push(['Indicateur : pertes de stock de '+fmt(pw)+' sur 7 jours'+(sv>0?' ('+Math.round(pw/sv*100)+' % de la valeur du stock).':'.'),sv>0&&pw>sv*0.05?1:0])}
  return a;
}
function vHome(){
  var ca=0,mg=0,enc=0,dep=0,cr=0,tre=0,pe=0,df=0,rows='';
  S.v.forEach(function(v){if(v.annul)return;if(isToday(v.t)){ca+=v.total;v.items.forEach(function(i){mg+=(i.prix-i.cout)*i.qte})}cr+=due(v)});
  S.mv.forEach(function(e){if(!isToday(e.t))return;var k=kind(e);if(k==='enc'||k==='aco')enc+=fc(e);if(k==='dep')dep-=fc(e);if(k==='ecart')pe-=fc(e)});
  S.sm.forEach(function(m){if(isToday(m.t)&&isLoss(m))pe+=lossVal(m)});S.ac.forEach(function(a){df+=dueA(a)});S.acc.forEach(function(a){var b=bal(a);tre+=b*(a.cur==='USD'?S.taux:1);rows+='<div class="row"><span>'+esc(lab(a))+'</span><b class="'+(b<0?'neg':'')+'">'+fa(b,a.cur)+'</b></div>'});
  var h=licBanner()+'<div class="card"><div class="mut">Trésorerie disponible (tous comptes)</div><div class="big '+(tre<0?'neg':'')+'">'+fmt(tre)+'</div>'+rows+'</div>'+
  '<div class="card"><h2>Aujourd\u2019hui</h2><div class="grid"><div class="k"><div class="mut">Ventes réalisées</div><b>'+fmt(ca)+'</b></div><div class="k"><div class="mut">Argent encaissé</div><b>'+fmt(enc)+'</b></div><div class="k"><div class="mut">Dépenses</div><b>'+fmt(dep)+'</b></div><div class="k"><div class="mut">Marge brute</div><b>'+fmt(mg)+'</b></div><div class="k"><div class="mut">Résultat estimé</div><b class="'+(mg-dep-pe<0?'neg':'pos')+'">'+fmt(mg-dep-pe)+'</b></div><div class="k"><div class="mut">Créances clients</div><b>'+fmt(cr)+'</b></div><div class="k"><div class="mut">Pertes de stock</div><b>'+fmt(pe)+'</b></div><div class="k"><div class="mut">Dettes fournisseurs</div><b>'+fmt(df)+'</b></div></div><p class="mut" style="margin:10px 0 0">Ventes réalisées \u2260 argent encaissé.</p></div>'+stockCard()+(ok('adm')?'<button class="b" style="margin:0 0 12px" onclick="go(\'rap\')">Résultats et rapports</button>':'')+'<h2>Alertes</h2>';
  var al=alertes();
  if(!al.length)h+='<div class="card mut">Aucune alerte pour le moment.</div>';
  al.forEach(function(x){h+='<div class="al'+(x[1]?' r':'')+'">'+x[0]+'</div>'});
  return h;
}
function vSell(){
  if(!S.p.length)return'<div class="card"><h2>Vendre</h2><p class="mut">Ajoutez d\u2019abord vos produits dans Stock.</p><button class="b" onclick="go(\'stock\')">Aller au Stock</button></div>';
  var o=S.p.map(function(p){return'<option value="'+p.id+'">'+esc(p.nom)+' \u2013 '+fmt(p.vente)+' ('+p.qte+')</option>'}).join(''),tot=cartTot();
  var h='<div class="card"><h2>Nouvelle vente</h2><label>Produit</label><select id="sp" onchange="fillPrice()">'+o+'</select><div class="grid"><div><label>Quantité</label><input id="sq" type="number" inputmode="decimal" value="1"></div><div><label>Prix unitaire ('+S.dev+')</label><input id="sx" type="number" inputmode="decimal" value="'+dp(S.p[0].vente)+'"'+(pol(S.p[0]).mode==='fixe'?' disabled':'')+'></div></div><div class="mut" id="sh" style="margin-top:6px">'+hint(S.p[0])+'</div><button class="b" onclick="addCart()">Ajouter au panier</button></div>';
  if(cart.length)h+='<div class="card"><h2>Panier</h2>'+cart.map(function(i,n){return'<div class="row"><span>'+esc(i.nom)+' \u00d7 '+i.qte+' \u00e0 '+fmt(i.prix)+(i.cat>i.prix?' <span class="mut">(remise '+Math.round((1-i.prix/i.cat)*100)+' %)</span>':'')+'</span><span><b>'+fmt(i.prix*i.qte)+'</b> <button class="s" onclick="cart.splice('+n+',1);R()">\u2715</button></span></div>'}).join('')+
  '<div class="row"><b>Total</b><b style="font-size:22px">'+fmt(tot)+'</b></div><label>Compte d\u2019encaissement</label><select id="ac" onchange="pre()">'+opts()+'</select><label id="pl">Montant reçu</label><input id="pay" type="number" inputmode="decimal" oninput="chk()"><div id="rst" class="mut" style="margin-top:4px"></div><input id="cl" placeholder="Nom du client (obligatoire s\u2019il reste à payer)" style="display:none;margin-top:8px"><button class="b" onclick="valider()">Valider la vente</button></div>';
  return h;
}
function fillPrice(){var p=S.p.find(function(x){return x.id===$('sp').value});if(!p)return;$('sx').value=dp(p.vente);$('sx').disabled=pol(p).mode==='fixe';$('sh').textContent=hint(p)}
function pre(){var a=acc($('ac').value);$('pay').value=tc(cartTot(),a.cur);$('pl').textContent='Montant reçu ('+a.cur+')';chk()}
function chk(){var a=acc($('ac').value),r=(num('pay')||0)*(a.cur==='USD'?S.taux:1),d=cartTot()-r;$('cl').style.display=d>=1?'block':'none';$('rst').textContent=d>=1?'Reste à payer (créance) : '+fmt(d):'Paiement complet'}
function addCart(){
  var p=S.p.find(function(x){return x.id===$('sp').value}),q=num('sq'),x=toFC(num('sx'));
  if(!p||!(q>0))return toast('Quantité invalide');
  var o=pol(p);if(o.mode==='fixe')x=p.vente;
  if(!(x>0))return toast('Prix invalide');
  if(o.mode==='nego'&&x<o.min-0.5){
    var F=[{l:'Motif de l\u2019exception'}];if(!ok('adm'))F.push({l:'PIN du gérant ou du propriétaire',t:'password'});
    return ask('Prix sous le minimum',F,function(v){
      var mo=v[0].trim(),au=CU.nom;if(!mo)return toast('Motif obligatoire');
      if(!ok('adm')){var m=S.us.find(function(u){return(u.role==='prop'||u.role==='resp')&&u.pin===hp(v[1])});if(!m){aud('Autorisation refusée',p.nom);save();return toast('PIN invalide : vente refusée')}au=m.nom}
      aud('Prix sous minimum',p.nom+' '+fmt(x)+' (min '+fmt(o.min)+') : '+mo+' | autorisé par '+au);pl(p,q,x,mo,au);
    },'Minimum autorisé : '+fmt(o.min));
  }
  pl(p,q,x,'','');
}
function pl(p,q,x,dg,au){
  var dej=cart.filter(function(i){return i.pid===p.id}).reduce(function(a,i){return a+i.qte},0);
  cart.push({pid:p.id,nom:p.nom,qte:q,prix:x,cat:p.vente,cout:p.cout,derog:dg,aut:au});
  if(dej+q>p.qte)toast('Stock insuffisant : vente permise, alerte créée');else if(x<p.cout)toast('Attention : vendu sous le coût');
  R();
}
function valider(){
  var a=acc($('ac').value),tot=cartTot(),r=num('pay')||0,c=$('cl').value.trim(),rf=r*(a.cur==='USD'?S.taux:1);
  if(tot-rf<1||rf>tot){r=tc(tot,a.cur);rf=tot}
  if(rf<tot&&!c)return toast('Entrez le nom du client');
  var v={id:uid(),t:Date.now(),items:cart,total:tot,client:c||'Comptoir',taux:S.taux,u:CU?CU.nom:''};
  cart.forEach(function(i){var p=S.p.find(function(x){return x.id===i.pid});if(p)p.qte-=i.qte});
  S.v.push(v);
  if(r>0)post('enc',a.id,r,v.id,'Vente');
  aud('Vente',fmt(tot)+' \u2022 '+v.client);cart=[];save();toast('Vente enregistrée');go('home');yes('Vente enregistrée','Envoyer le reçu au client par WhatsApp ?',function(){recu(v.id)},'Envoyer le reçu');
}
function vStock(){

function rapData(p){
  var n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),st=p==='j'?t0:p==='s'?t0-6*D:new Date(n.getFullYear(),n.getMonth(),1).getTime();
  var r={ca:0,cg:0,enc:0,dep:0,ach:0,pe:0,nv:0,top:[]},pm={};
  S.v.forEach(function(v){if(v.annul||v.t<st)return;r.nv++;r.ca+=v.total;v.items.forEach(function(i){r.cg+=i.cout*i.qte;pm[i.nom]=(pm[i.nom]||0)+(i.prix-i.cout)*i.qte})});
  S.mv.forEach(function(e){if(e.t<st)return;var k=kind(e);if(k==='enc'||k==='aco')r.enc+=fc(e);if(k==='dep')r.dep-=fc(e);if(k==='ecart')r.pe-=fc(e)});
  S.sm.forEach(function(m){if(m.t>=st&&isLoss(m))r.pe+=lossVal(m)});
  S.ac.forEach(function(a){if(!a.annul&&a.t>=st)r.ach+=a.total});
  r.top=Object.keys(pm).sort(function(a,b){return pm[b]-pm[a]}).slice(0,5).map(function(k){return[k,pm[k]]});
  r.marge=r.ca-r.cg;r.res=r.marge-r.dep-r.pe;
  r.cr=S.v.reduce(function(x,v){return x+due(v)},0);r.df=S.ac.reduce(function(x,a){return x+dueA(a)},0);
  return r;
}
var PN={j:'du jour',s:'des 7 derniers jours',m:'du mois'};
function setRp(p){RPD=p;R()}
function vRap(){
  var r=rapData(RPD),row=function(a,b,c){return'<div class="row"><span>'+a+'</span><b class="'+(c||'')+'">'+fmt(b)+'</b></div>'};
  return'<div class="card"><h2>Résultats '+PN[RPD]+'</h2><div style="display:flex;gap:6px;margin-bottom:10px">'+[['j','Jour'],['s','Semaine'],['m','Mois']].map(function(x){return'<button class="'+(x[0]===RPD?'b':'s')+'" style="flex:1;margin:0;padding:10px" onclick="setRp(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>'+
  row('Ventes ('+r.nv+')',r.ca)+row('\u2212 Coût des marchandises vendues',r.cg)+row('= Marge brute',r.marge,'pos')+row('\u2212 Dépenses',r.dep)+row('\u2212 Pertes et écarts',r.pe)+row('= Résultat estimatif',r.res,r.res<0?'neg':'pos')+
  '<p class="mut" style="margin:10px 0 0">Résultat de gestion, non comptable ni fiscal.</p></div><div class="card"><h2>Trésorerie et engagements</h2>'+row('Argent encaissé',r.enc)+row('Achats de la période',r.ach)+row('Créances clients (total)',r.cr)+row('Dettes fournisseurs (total)',r.df)+'</div>'+
  '<div class="card"><h2>Produits les plus rentables</h2>'+(r.top.length?r.top.map(function(t){return row(esc(t[0]),t[1])}).join(''):'<div class="mut">Aucune vente sur la période.</div>')+'<button class="b" onclick="shareT(rapTxt())">Partager le rapport (WhatsApp)</button></div>';
}
function rapTxt(){
  var r=rapData(RPD);
  return[S.biz.nom,'Rapport '+PN[RPD]+' \u2022 '+new Date().toLocaleDateString('fr-FR'),'','Ventes : '+fmt(r.ca),'Coût des marchandises : '+fmt(r.cg),'Marge brute : '+fmt(r.marge),'Dépenses : '+fmt(r.dep),'Pertes et écarts : '+fmt(r.pe),'Résultat estimatif : '+fmt(r.res),'','Encaissé : '+fmt(r.enc),'Créances : '+fmt(r.cr),'Dettes fournisseurs : '+fmt(r.df),'','Résultat de gestion, non comptable.'].join('\n');
}
function vArgent(){
  var h='<div class="card"><h2>Mouvement d\u2019argent</h2><label>Type</label><select id="ot" onchange="tog()"><option value="dep">Dépense de l\u2019entreprise</option><option value="apo">Apport du propriétaire</option><option value="pre">Prélèvement personnel</option><option value="trf">Transfert entre comptes</option></select><label id="ol">Compte</label><select id="oa" onchange="tog()">'+opts()+'</select><div id="odv" style="display:none"><label>Compte de destination</label><select id="od" onchange="tog()">'+opts()+'</select></div><label id="oml">Montant</label><input id="om" type="number" inputmode="decimal"><div id="orv" style="display:none"><label id="orl">Montant reçu</label><input id="or" type="number" inputmode="decimal"></div><label>Motif</label><input id="on" placeholder="Transport, loyer, retrait\u2026"><button class="b" onclick="addOp()">Enregistrer</button></div><h2>Journal</h2>';
  var l=S.mv.slice(-15).reverse();
  if(!l.length)h+='<div class="card mut">Aucun mouvement.</div>';
  else h+='<div class="card">'+l.map(function(e){
    var a=acc(e.acc),can=!e.ann&&e.type!=='annul';
    return'<div class="row"><span><b>'+TY[e.type]+'</b> '+(e.ann?'<span class="mut">(annulé)</span>':'')+'<br><span class="mut">'+new Date(e.t).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' \u2022 '+esc(lab(a))+(e.note?' \u2022 '+esc(e.note):'')+'</span></span><span style="text-align:right"><b class="'+(e.m<0?'neg':'pos')+'">'+fa(e.m,e.cur)+'</b>'+(can?'<br><button class="s" onclick="annule(\''+e.id+'\')">Annuler</button>':'')+'</span></div>'}).join('')+'</div>';
  return h+clCard();
}
function tog(){
  var t=$('ot').value,f=acc($('oa').value),d=acc($('od').value),x=t==='trf';
  $('odv').style.display=x?'block':'none';$('orv').style.display=x&&f.cur!==d.cur?'block':'none';
  $('ol').textContent=x?'Compte source':t==='apo'?'Compte qui reçoit':'Compte débité';
  $('oml').textContent='Montant ('+f.cur+')';$('orl').textContent='Montant reçu ('+d.cur+')';
}
function addOp(){
  var t=$('ot').value,a=$('oa').value,f=acc(a),m=num('om'),n=$('on').value.trim();
  if(!(m>0))return toast('Entrez un montant');
  if(t==='dep'&&!n)return toast('Entrez le motif');
  var run=function(){
    if(t==='trf'){
      var b=$('od').value,d=acc(b),m2=f.cur===d.cur?m:num('or');
      if(a===b)return toast('Choisissez deux comptes différents');
      if(!(m2>0))return toast('Entrez le montant reçu');
      var r=uid();post('trf',a,-m,r,n||'Transfert');post('trf',b,m2,r,n||'Transfert');
    }else post(t,a,t==='apo'?m:-m,'',n);
    aud('Mouvement',TY[t]+' '+fa(m,f.cur)+(n?' : '+n:''));save();toast('Mouvement enregistré');R();
  };
  if(t!=='apo'&&bal(f)<m)yes('Solde insuffisant','Le compte '+lab(f)+' est insuffisant. Continuer quand même ?',run);else run();
}
function annule(id){
  var e=S.mv.find(function(x){return x.id===id});
  if(!e||e.ann||e.type==='annul')return;
  ask('Annuler cette opération',[{l:'Motif de l\u2019annulation'}],function(v){
    var mo=v[0].trim();if(!mo)return toast('Motif obligatoire');
    var g=e.type==='trf'?S.mv.filter(function(x){return x.ref===e.ref&&x.type==='trf'&&!x.ann}):[e];
    g.forEach(function(o){S.mv.push({id:uid(),t:Date.now(),type:'annul',of:o.type,rev:o.id,acc:o.acc,cur:o.cur,m:-o.m,taux:o.taux,ref:o.ref,note:'Annulation : '+mo});o.ann=true});
    aud('Annulation',TY[e.type]+' : '+mo);save();toast('Opération annulée (écriture inverse créée)');R();
  },'Une écriture inverse sera créée, rien n\u2019est effacé.');
}
function annuleVente(id){
  var v=S.v.find(function(x){return x.id===id});if(!v||v.annul)return;
  ask('Annuler cette vente',[{l:'Motif de l\u2019annulation'}],function(w){
    var mo=w[0].trim();if(!mo)return toast('Motif obligatoire');
    S.mv.filter(function(e){return ((e.ref===v.id&&e.type==='enc')||(v.ord&&e.ref===v.ord&&e.type==='aco'))&&!e.ann}).forEach(function(o){S.mv.push({id:uid(),t:Date.now(),type:'annul',of:o.type,rev:o.id,acc:o.acc,cur:o.cur,m:-o.m,taux:o.taux,ref:o.ref,note:'Annulation vente : '+mo});o.ann=true});
    v.items.forEach(function(i){var p=S.p.find(function(x){return x.id===i.pid});if(p)p.qte+=i.qte});
    aud('Annulation vente',fmt(v.total)+' : '+mo);v.annul=true;v.motif=mo;save();toast('Vente annulée, stock rétabli');R();
  },'Les paiements seront remboursés et le stock rétabli.');
}
function vPlus(){
  var dl=S.v.filter(function(v){return due(v)>=1}),a0=S.acc[0];
  var h=bizCard()+'<div class="card"><h2>Créances clients</h2>';
  if(!dl.length)h+='<div class="mut">Aucune créance en cours.</div>';
  dl.forEach(function(v){h+='<div style="padding:9px 0;border-bottom:1px solid var(--line)"><div class="row" style="border:0;padding:0"><span><b>'+esc(v.client)+'</b><br><span class="mut">'+new Date(v.t).toLocaleDateString('fr-FR')+' \u2022 Total '+fmt(v.total)+' \u2022 Payé '+fmt(paid(v))+'</span></span><b class="neg">'+fmt(due(v))+'</b></div><div style="display:flex;gap:6px;margin-top:6px"><input id="da_'+v.id+'" type="number" inputmode="decimal" style="width:34%" value="'+tc(due(v),a0.cur)+'"><select id="dc_'+v.id+'" style="width:42%">'+opts()+'</select><button class="s" onclick="pay(\''+v.id+'\')">Encaisser</button></div></div>'});
  h+='</div><div class="card"><h2>Dernières ventes</h2>';
  var vs=S.v.slice(-6).reverse();
  if(!vs.length)h+='<div class="mut">Aucune vente.</div>';
  vs.forEach(function(v){h+='<div class="row"><span>'+esc(v.client)+'<br><span class="mut">'+new Date(v.t).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span></span><span style="text-align:right"><b>'+fmt(v.total)+'</b><br><button class="s" onclick="recu(\''+v.id+'\')">Reçu</button> '+(v.annul?'<span class="mut">annulée</span>':'<button class="s" onclick="annuleVente(\''+v.id+'\')">Annuler</button>')+'</span></div>'});
  h+='</div><div class="card"><h2>Taux du jour</h2><label>1 USD = ? FC</label><input type="number" inputmode="numeric" value="'+S.taux+'" onchange="S.taux=parseFloat(this.value)||2800;aud(\'Taux du jour\',this.value);save();toast(\'Taux mis à jour\');R()"><p class="mut">Chaque opération garde le taux du moment où elle a été saisie.</p></div>'+
  '<div class="card"><h2>Comptes</h2>'+S.acc.map(function(a){return'<div class="row"><span>'+esc(lab(a))+'</span><b>'+fa(bal(a),a.cur)+'</b></div>'}).join('')+'<label>Nouveau compte</label><input id="an" placeholder="Ex : Airtel Money, Banque"><label>Devise</label><select id="ad"><option>FC</option><option>USD</option></select><button class="b" onclick="addAcc()">Ajouter le compte</button></div>'+
  '<div class="card"><h2>Sauvegarde</h2><p class="mut">Copiez ce texte et gardez-le (WhatsApp, e-mail).</p><button class="b" style="margin-top:0" onclick="bk()">Copier la sauvegarde</button><label>Restaurer</label><textarea id="rs" placeholder="Collez ici une sauvegarde"></textarea><button class="b" onclick="rest()">Restaurer</button></div>'+appCard()+(ok('usr')?usrCard():'')+auCard();
  return h;
}
function addAcc(){var n=$('an').value.trim();if(!n)return toast('Entrez un nom');S.acc.push({id:uid(),nom:n,cur:$('ad').value});save();toast('Compte ajouté');R()}
function pay(id){
  var v=S.v.find(function(x){return x.id===id}),a=acc($('dc_'+id).value),m=num('da_'+id),d=due(v);
  if(!(m>0))return toast('Montant invalide');
  if(m*(a.cur==='USD'?S.taux:1)>d-1)m=tc(d,a.cur);
  post('enc',a.id,m,v.id,'Tranche '+v.client);aud('Encaissement créance',v.client+' '+fa(m,a.cur));save();toast('Tranche enregistrée');R();
}
function bk(){
  var j=JSON.stringify(S),f=function(){ask('Copiez la sauvegarde',[{l:'Sauvegarde (sélectionnez tout et copiez)',v:j}],function(){})};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(j).then(function(){toast('Sauvegarde copiée')},f);else f();
}
function rest(){
  try{var o=JSON.parse($('rs').value);if(!o.p||!o.v||!o.mv||!o.acc)throw 0;
    yes('Restaurer la sauvegarde','Remplacer toutes les données actuelles ?',function(){S=o;norm();save();toast('Restauré');R()});
  }catch(e){toast('Sauvegarde invalide')}
}
var TABS=[['home','🏠','Caisse'],['sell','🛒','Vendre'],['stock','📦','Stock'],['ach','🚚','Achats'],['cmd','📋','Commande'],['arg','💱','Argent'],['more','⚙️','Plus'],['lic','🔑','Abonnement']];
function R(){
  $('cur').textContent=S.dev;$('ttl').textContent=S.biz?S.biz.nom:'ESPOIR Finance';
  if(!S.biz){$('app').innerHTML=vBiz();$('nav').innerHTML='';bizType(1);return}
  if(!S.us.length){$('app').innerHTML=vPin0();$('nav').innerHTML='';return}
  if(!CU){$('app').innerHTML=vLock();$('nav').innerHTML='';return}
  var AL=allowed();if(AL.indexOf(tab)<0&&!((tab==='biz'||tab==='lic')&&ok('biz'))&&!(tab==='rap'&&ok('adm')))tab=AL[0];
  if(tab==='biz'){$('app').innerHTML=vBiz();$('nav').innerHTML=navH();bizType(1);return}
  $('app').innerHTML={home:vHome,sell:vSell,stock:vStock,arg:vArgent,ach:vAchats,cmd:vCmd,more:vPlus,lic:vLic,rap:vRap}[tab]();
  $('nav').innerHTML=navH();
  if(tab==='sell'&&cart.length)pre();
  if(tab==='arg'){tog();clUp()}
  if(tab==='ach'&&pc.length)preA();
  if(tab==='cmd'&&oc.length)preO();
  roleFilter();
}
if(window.addEventListener)window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();DP=e});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
if(document.addEventListener){document.addEventListener('click',bump,true);document.addEventListener('keydown',bump,true)}
start();
</script>
