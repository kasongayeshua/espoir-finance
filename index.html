<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12355b">
<title>ESPOIR Finance</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#14213d;--mut:#667085;--btn:#12355b;--bi:#fff;--acc:#f5b800;--red:#c8102e;--ok:#1b7f4b;--line:#e3dfd3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding-bottom:80px}
header{background:var(--btn);color:var(--bi);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px}
header button{background:transparent;color:var(--bi);border:1.2px solid var(--bi);border-radius:16px;padding:4px 10px;font-weight:700;font-size:13px}
main{max-width:620px;margin:0 auto;padding:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
h2{font-size:17px;margin:0 0 8px}
.big{font-size:26px;font-weight:800;margin:2px 0}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{border-left:4px solid var(--acc);padding-left:8px}
label{display:block;font-size:13px;color:var(--mut);margin:6px 0 2px}
input,select{width:100%;padding:10px;border:1.2px solid var(--line);border-radius:8px;font-size:15px;background:var(--bg);color:var(--ink)}
button.b{width:100%;margin-top:10px;padding:12px;border:0;border-radius:8px;background:var(--btn);color:var(--bi);font-size:15px;font-weight:700}
button.s{border:1.2px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:5px 8px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.al{border-left:4px solid var(--acc);background:var(--card);padding:9px 10px;margin-bottom:8px;border-radius:6px;border:1px solid var(--line)}
.al.r{border-left-color:var(--red)}
.neg{color:var(--red)}.pos{color:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex}
nav button{flex:1;border:0;background:none;padding:8px 0;color:var(--mut);font-size:10px;font-weight:600}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
nav span{display:block;font-size:16px}
</style>
</head>
<body>
<header>
  <b id="ttl">ESPOIR Finance</b>
  <span><button onclick="lock()">🔒</button> <button id="cur" onclick="swap()">FC</button></span>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var S=null, tab='home', cart=[], KEY='espoir_v03', CU=null, PM='full', SQ='', SP='', SAC='';

function init(){
  return {
    taux:2265, dev:'FC',
    acc:[{id:'a1', nom:'Caisse principale', cur:'FC'}, {id:'a2', nom:'Caisse USD', cur:'USD'}],
    p:[{id:'p1', nom:'Exemple Produit', cout:1000, vente:1500, qte:10, seuil:2, svc:false, u:'pièce'}],
    v:[], mv:[], biz:{nom:'ESPOIR Finance', type:'Boutique', resp:'', tel:''},
    us:[{id:'u1', nom:'Propriétaire', role:'prop'}], au:[], cl:[], od:[], cs:[], fr:[], ac:[], sm:[]
  };
}

function loadData(){
  try {
    var raw = localStorage.getItem(KEY);
    if(raw) S = JSON.parse(raw);
  } catch(e) {}
  if(!S || !S.biz || !S.p) {
    S = init();
    saveData();
  }
  CU = S.us && S.us[0] ? S.us[0] : {id:'u1', nom:'Propriétaire', role:'prop'};
}

function saveData(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
}

function swap(){
  S.dev = S.dev === 'FC' ? 'USD' : 'FC';
  saveData();
  render();
}

function go(t){
  tab = t;
  render();
  window.scrollTo(0, 0);
}

function fmt(n){
  return S.dev === 'USD' ? '$' + Math.round(n / S.taux * 100) / 100 : Math.round(n) + ' FC';
}

function lock(){
  CU = null;
  render();
}

var TABS=[
  ['home','Accueil','🏠'],
  ['sell','Vente','🛒'],
  ['stock','Stock','📦'],
  ['ach','Achats','📥'],
  ['cmd','Commandes','📋'],
  ['arg','Argent','💵'],
  ['more','Plus','⚙️']
];

function navH(){
  return TABS.map(function(t){
    return '<button class="' + (t[0] === tab ? 'on' : '') + '" onclick="go(\'' + t[0] + '\')"><span>' + t[2] + '</span>' + t[1] + '</button>';
  }).join('');
}

function render(){
  try {
    var app = document.getElementById('app');
    if(!app) return;
    document.getElementById('ttl').textContent = S.biz && S.biz.nom ? S.biz.nom : 'ESPOIR Finance';
    document.getElementById('cur').textContent = S.dev;

    if(!CU){
      app.innerHTML = '<div class="card"><h2>Connexion</h2><button class="b" onclick="CU={id:\'u1\',nom:\'Propriétaire\',role:\'prop\'};render();">Ouvrir l\'application</button></div>';
      document.getElementById('nav').innerHTML = '';
      return;
    }

    if(tab === 'home'){
      app.innerHTML = '<div class="card"><h2>Tableau de bord</h2><div class="big">Actif</div><p class="mut">Application opérationnelle.</p><button class="b" onclick="go(\'sell\')">🛒 Démarrer une vente</button></div>' +
                      '<div class="card"><h2>Résumé</h2><p class="mut">Produits en stock : <b>' + S.p.length + '</b></p></div>';
    } else if(tab === 'sell'){
      app.innerHTML = '<div class="card"><h2>Nouvelle Vente</h2><label>Produit</label><select>' + S.p.map(function(p){ return '<option>' + p.nom + ' (' + fmt(p.vente) + ')</option>'; }).join('') + '</select><button class="b" onclick="alert(\'Vente enregistrée\')">Valider</button></div>';
    } else if(tab === 'stock'){
      app.innerHTML = '<div class="card"><h2>Gestion du Stock (' + S.p.length + ')</h2>' + S.p.map(function(p){ return '<div class="row"><b>' + p.nom + '</b><span>' + p.qte + ' pces</span></div>'; }).join('') + '<button class="b" onclick="var n=prompt(\'Nom :\');if(n){S.p.push({id:Date.now(),nom:n,vente:1500,qte:5});saveData();render();}">+ Ajouter</button></div>';
    } else if(tab === 'ach'){
      app.innerHTML = '<div class="card"><h2>Achats & Fournisseurs</h2><p class="mut">Module d’approvisionnement.</p></div>';
    } else if(tab === 'cmd'){
      app.innerHTML = '<div class="card"><h2>Commandes clients</h2><p class="mut">Suivi des commandes.</p></div>';
    } else if(tab === 'arg'){
      app.innerHTML = '<div class="card"><h2>Argent & Caisse</h2><p class="mut">Comptes de trésorerie actifs.</p></div>';
    } else if(tab === 'more'){
      app.innerHTML = '<div class="card"><h2>Plus / Paramètres</h2><label>Nom de l’établissement</label><input id="bn" value="' + (S.biz.nom || '') + '"><button class="b" onclick="S.biz.nom=document.getElementById(\'bn\').value;saveData();render();alert(\'Enregistré\');">Enregistrer</button></div>';
    }
    document.getElementById('nav').innerHTML = navH();
  } catch(err){
    document.getElementById('app').innerHTML = '<div class="card al r"><h2>Erreur</h2><p class="mut">' + err.message + '</p></div>';
  }
}

window.addEventListener('DOMContentLoaded', function(){
  loadData();
  render();
});
</script>
</body>
</html>
