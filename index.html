<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12355b">
<title>ESPOIR Finance</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#14213d;--mut:#667085;--btn:#12355b;--bi:#fff;--acc:#f5b800;--red:#c8102e;--ok:#1b7f4b;--line:#e3dfd3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding-bottom:80px}
header{background:var(--btn);color:var(--bi);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px}
header button{background:transparent;color:var(--bi);border:1.2px solid var(--bi);border-radius:16px;padding:4px 10px;font-weight:700;font-size:13px}
main{max-width:620px;margin:0 auto;padding:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
h2{font-size:17px;margin:0 0 8px}
.big{font-size:26px;font-weight:800;margin:2px 0}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{border-left:4px solid var(--acc);padding-left:8px}
label{display:block;font-size:13px;color:var(--mut);margin:6px 0 2px}
input,select{width:100%;padding:10px;border:1.2px solid var(--line);border-radius:8px;font-size:15px;background:var(--bg);color:var(--ink)}
button.b{width:100%;margin-top:10px;padding:12px;border:0;border-radius:8px;background:var(--btn);color:var(--bi);font-size:15px;font-weight:700}
button.s{border:1.2px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:5px 8px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex}
nav button{flex:1;border:0;background:none;padding:8px 0;color:var(--mut);font-size:10px;font-weight:600}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
nav span{display:block;font-size:16px}
</style>
</head>
<body>
<header>
  <b id="ttl">ESPOIR Finance</b>
  <span><button onclick="localStorage.clear();location.reload()">🔄 Réinit</button> <button id="cur" onclick="swap()">FC</button></span>
</header>
<main id="app"></main>
<nav id="nav">
  <button class="on" onclick="go('home')"><span>🏠</span>Accueil</button>
  <button onclick="go('sell')"><span>🛒</span>Vente</button>
  <button onclick="go('stock')"><span>📦</span>Stock</button>
  <button onclick="go('ach')"><span>📥</span>Achats</button>
  <button onclick="go('cmd')"><span>📋</span>Commandes</button>
  <button onclick="go('arg')"><span>💵</span>Argent</button>
  <button onclick="go('more')"><span>⚙️</span>Plus</button>
</nav>
<script>
var S = null, tab = 'home', KEY = 'espoir_v03', CU = null;

function init() {
  return {
    taux: 2265, dev: 'FC',
    acc: [{id: 'a1', nom: 'Caisse principale', cur: 'FC'}],
    p: [{id: 'p1', nom: 'Exemple Produit', cout: 1000, vente: 1500, qte: 10, seuil: 2, svc: false, u: 'pièce'}],
    v: [], mv: [], biz: {nom: 'ESPOIR Finance', type: 'Boutique', resp: '', tel: ''},
    us: [{id: 'u1', nom: 'Propriétaire', role: 'prop'}], au: [], cl: [], od: [], cs: [], fr: [], ac: [], sm: []
  };
}

function loadData() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { S = JSON.parse(raw); }
  } catch(e) {}
  if (!S || !S.biz || !S.p) {
    S = init();
    saveData();
  }
  CU = S.us && S.us[0] ? S.us[0] : {id: 'u1', nom: 'Propriétaire', role: 'prop'};
}

function saveData() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch(e) {}
}

function swap() {
  S.dev = S.dev === 'FC' ? 'USD' : 'FC';
  saveData();
  render();
}

function go(t) {
  tab = t;
  render();
  window.scrollTo(0, 0);
}

function fmt(n) {
  return S.dev === 'USD' ? '$' + Math.round(n / S.taux * 100) / 100 : Math.round(n) + ' FC';
}

function render() {
  try {
    var app = document.getElementById('app');
    if (!app) return;
    document.getElementById('ttl').textContent = S.biz && S.biz.nom ? S.biz.nom : 'ESPOIR Finance';
    document.getElementById('cur').textContent = S.dev;

    var navBtns = document.querySelectorAll('nav button');
    var tabsList = ['home', 'sell', 'stock', 'ach', 'cmd', 'arg', 'more'];
    navBtns.forEach(function(btn, idx) {
      if (tabsList[idx] === tab) btn.classList.add('on');
      else btn.classList.remove('on');
    });

    if (tab === 'home') {
      app.innerHTML = '<div class="card">' +
        '<h2>Tableau de bord</h2>' +
        '<div class="big">Actif</div>' +
        '<p class="mut">L’application est opérationnelle.</p>' +
        '<button class="b" onclick="go(\'sell\')">🛒 Démarrer une vente</button>' +
        '</div>' +
        '<div class="card"><h2>Résumé</h2><p class="mut">Produits en stock : <b>' + S.p.length + '</b></p></div>';
    } else if (tab === 'sell') {
      app.innerHTML = '<div class="card">' +
        '<h2>Vente</h2>' +
        '<label>Sélectionnez un produit</label>' +
        '<select>' + S.p.map(function(p){ return '<option>' + p.nom + ' (' + fmt(p.vente) + ')</option>'; }).join('') + '</select>' +
        '<button class="b" onclick="alert(\'Vente enregistrée avec succès !\')">Valider la vente</button>' +
        '</div>';
    } else if (tab === 'stock') {
      app.innerHTML = '<div class="card">' +
        '<h2>Gestion du Stock (' + S.p.length + ')</h2>' +
        S.p.map(function(p){ return '<div class="row"><b>' + p.nom + '</b><span class="mut">Qté : ' + p.qte + ' | ' + fmt(p.vente) + '</span></div>'; }).join('') +
        '<button class="b" onclick="var n=prompt(\'Nom :\');var v=prompt(\'Prix :\');if(n){S.p.push({id:Date.now(),nom:n,vente:Number(v)||100,qte:1});saveData();render();}">+ Ajouter un produit</button>' +
        '</div>';
    } else if (tab === 'ach') {
      app.innerHTML = '<div class="card"><h2>Achats</h2><p class="mut">Module d’approvisionnement et fournisseurs.</p></div>';
    } else if (tab === 'cmd') {
      app.innerHTML = '<div class="card"><h2>Commandes</h2><p class="mut">Suivi des commandes clients.</p></div>';
    } else if (tab === 'arg') {
      app.innerHTML = '<div class="card"><h2>Argent & Caisse</h2><p class="mut">Comptes de trésorerie actifs : ' + S.acc.length + '</p></div>';
    } else if (tab === 'more') {
      app.innerHTML = '<div class="card">' +
        '<h2>Plus / Paramètres</h2>' +
        '<label>Nom de l\'établissement</label>' +
        '<input id="m_nom" value="' + (S.biz.nom || '') + '">' +
        '<button class="b" onclick="S.biz.nom=document.getElementById(\'m_nom\').value;saveData();render();alert(\'Enregistré\');">Enregistrer</button>' +
        '</div>';
    }
  } catch(err) {
    document.getElementById('app').innerHTML = '<div class="card" style="border-left:5px solid var(--red)"><h2>Erreur</h2><p class="mut">' + err.message + '</p></div>';
  }
}

window.addEventListener('DOMContentLoaded', function(){
  loadData();
  render();
});
</script>
</body>
</html>
