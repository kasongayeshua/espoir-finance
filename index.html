<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12355b">
<title>ESPOIR Finance</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#14213d;--mut:#667085;--btn:#12355b;--bi:#fff;--acc:#f5b800;--red:#c8102e;--ok:#1b7f4b;--line:#e3dfd3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding-bottom:84px}
header{background:var(--btn);color:var(--bi);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
main{max-width:620px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
button.b{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--btn);color:var(--bi);font-size:16px;font-weight:700}
button.r{background:var(--red);color:#fff}
</style>
</head>
<body>
<header><b id="ttl">ESPOIR Finance</b><span><button onclick="localStorage.clear();location.reload()">🔄 Réinitialiser</button></span></header>
<main id="app">
  <div class="card">
    <h2>Chargement en cours...</h2>
    <p class="mut">Si l'écran reste blanc, cliquez sur le bouton ci-dessous pour forcer le démarrage propre.</p>
    <button class="b" onclick="forcerDemarrage()">Démarrer d'urgence</button>
  </div>
</main>
<script>
var S=null,CU=null,KEY='espoir_v03';
function init(){
  return {taux:2265,dev:'FC',acc:[{id:'a1',nom:'Caisse',cur:'FC'}],p:[],v:[],mv:[],biz:{nom:'Mon Activité',type:'Boutique'},us:[{id:'u1',nom:'Propriétaire',role:'prop',pin:'1c1a'}],au:[],cl:[],od:[],cs:[],fr:[],ac:[],sm:[]};
}
function forcerDemarrage(){
  try {
    S=init();
    CU={id:'u1',nom:'Propriétaire',role:'prop'};
    var app=document.getElementById('app');
    app.innerHTML='<div class="card"><h2>Activité active</h2><p class="mut">Le système a démarré avec succès.</p><button class="b" onclick="location.reload()">Actualiser l\'application</button></div>';
  } catch(e) {
    alert('Erreur : ' + e.message);
  }
}
window.addEventListener('DOMContentLoaded', function(){
  setTimeout(forcerDemarrage, 200);
});
</script>
</body>
</html>
