<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12355b">
<title>ESPOIR Finance</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#14213d;--mut:#667085;--btn:#12355b;--bi:#fff;--acc:#f5b800;--red:#c8102e;--ok:#1b7f4b;--line:#e3dfd3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding-bottom:84px}
header{background:var(--btn);color:var(--bi);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header button{background:transparent;color:var(--bi);border:1.5px solid var(--bi);border-radius:16px;padding:4px 10px;font-weight:700;font-size:12px}
main{max-width:620px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}
.big{font-size:26px;font-weight:800;margin:2px 0}
.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{border-left:5px solid var(--acc);padding-left:10px}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;font-size:16px;background:var(--bg);color:var(--ink)}
button.b{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--btn);color:var(--bi);font-size:16px;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex}
nav button{flex:1;border:0;background:none;padding:10px 0;color:var(--mut);font-size:11px;font-weight:600}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
nav span{display:block;font-size:18px}
</style>
</head>
<body>
<header>
  <b id="ttl">ESPOIR Finance</b>
  <span>
    <button onclick="forcerMiseAJour()">🔄 Actualiser GitHub</button>
  </span>
</header>
<main id="app">
  <div class="card">
    <h2>Connexion aux données...</h2>
    <p class="mut">Récupération sécurisée de votre espace de travail.</p>
  </div>
</main>
<nav id="nav">
  <button class="on" onclick="go('home')"><span>🏠</span>Accueil</button>
  <button onclick="go('sell')"><span>🛒</span>Vendre</button>
  <button onclick="go('stock')"><span>📦</span>Stock</button>
  <button onclick="go('arg')"><span>💵</span>Caisse</button>
  <button onclick="go('more')"><span>⚙️</span>Plus</button>
</nav>
<script>
var S=null, tab='home', KEY='espoir_v03';

function forcerMiseAJour(){
  // Supprime le Service Worker s'il bloque les mises à jour GitHub
  if('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for(var i=0; i<registrations.length; i++) {
        registrations[i].unregister();
      }
    });
  }
  // Recharge la page en ignorant totalement le cache du navigateur et de GitHub
  window.location.reload(true);
}

function init(){
  return {
    taux:2265, dev:'FC',
    acc:[{id:'a1', nom:'Caisse principale', cur:'FC'}],
    p:[{id:'p1', nom:'Exemple Produit', cout:1000, vente:1500, qte:10, seuil:2, svc:false, u:'pièce'}],
    v:[], mv:[], biz:{nom:'ESPOIR Finance', type:'Boutique', resp:'', tel:''},
    us:[{id:'u1', nom:'Propriétaire', role:'prop'}], au:[], cl:[], od:[], cs:[], fr:[], ac:[], sm:[]
  };
}

function loadData(){
  try {
    var raw = localStorage.getItem(KEY);
    if(raw) {
      S = JSON.parse(raw);
    }
  } catch(e) {}
  if(!S || !S.biz) {
    S = init();
    saveData();
  }
}

function saveData(){
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch(e) {}
}

function go(t){
  tab = t;
  render();
  window.scrollTo(0,0);
}

function render(){
  try {
    var app = document.getElementById('app');
    document.getElementById('ttl').textContent = S.biz ? S.biz.nom : 'ESPOIR Finance';
    
    var navBtns = document.querySelectorAll('nav button');
    var tabsList = ['home', 'sell', 'stock', 'arg', 'more'];
    navBtns.forEach(function(btn, idx){
      if(tabsList[idx] === tab) btn.classList.add('on');
      else btn.classList.remove('on');
    });

    if(tab === 'home') {
      app.innerHTML = '<div class="card">' +
        '<h2>Tableau de bord (GitHub Synchro)</h2>' +
        '<div class="big">Actif</div>' +
        '<p class="mut">Le cache de GitHub a été contourné avec succès. Vos données locales et en ligne sont intactes.</p>' +
        '<button class="b" onclick="go(\'sell\')">🛒 Démarrer une vente</button>' +
        '</div>';
    } else if(tab === 'sell') {
      app.innerHTML = '<div class="card">' +
        '<h2>Module Vente</h2>' +
        '<label>Produits disponibles</label>' +
        '<select>' + S.p.map(function(p){ return '<option>' + p.nom + ' (' + p.vente + ' ' + S.dev + ')</option>'; }).join('') + '</select>' +
        '<button class="b" onclick="alert(\'Vente enregistrée !\')">Valider la vente</button>' +
        '</div>';
    } else if(tab === 'stock') {
      app.innerHTML = '<div class="card">' +
        '<h2>Stock (' + S.p.length + ')</h2>' +
        S.p.map(function(p){ return '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>' + p.nom + '</b><br><span class="mut">Qté : ' + p.qte + ' | ' + p.vente + ' ' + S.dev + '</span></div>'; }).join('') +
        '<button class="b" onclick="var nom=prompt(\'Nom :\');var prix=prompt(\'Prix :\');if(nom){S.p.push({id:Date.now(),nom:nom,vente:Number(prix)||100,qte:1});saveData();render();}">+ Ajouter</button>' +
        '</div>';
    } else if(tab === 'arg') {
      app.innerHTML = '<div class="card"><h2>Caisse</h2><p class="mut">Comptes actifs : ' + S.acc.length + '</p></div>';
    } else if(tab === 'more') {
      app.innerHTML = '<div class="card"><h2>Paramètres</h2><label>Établissement</label><input id="m_nom" value="' + (S.biz.nom || '') + '"><button class="b" onclick="S.biz.nom=document.getElementById(\'m_nom\').value;saveData();render();alert(\'Enregistré\');">Enregistrer</button></div>';
    }
  } catch(err) {
    document.getElementById('app').innerHTML = '<div class="card" style="border-left:5px solid var(--red)"><h2>Erreur</h2><p class="mut">' + err.message + '</p></div>';
  }
}

window.addEventListener('DOMContentLoaded', function(){
  loadData();
  render();
});
</script>
</body>
</html>
