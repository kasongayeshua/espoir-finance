<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12355b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ESPOIR Finance</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#14213d;--mut:#667085;--btn:#12355b;--bi:#fff;--acc:#f5b800;--red:#c8102e;--ok:#1b7f4b;--line:#e3dfd3}
@media(prefers-color-scheme:dark){:root{--bg:#0e1726;--card:#16233a;--ink:#eef1f6;--mut:#9aa7bd;--btn:#f5b800;--bi:#14213d;--line:#263757}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;padding-bottom:84px}
header{flex-wrap:wrap;background:var(--btn);color:var(--bi);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:19px}
header button{background:transparent;color:var(--bi);border:1.5px solid var(--bi);border-radius:20px;padding:5px 14px;font-weight:700}
main{max-width:620px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}
.big{font-size:30px;font-weight:800;margin:2px 0}
.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{border-left:5px solid var(--acc);padding-left:10px}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;font-size:16px;background:var(--bg);color:var(--ink)}
button.b{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--btn);color:var(--bi);font-size:16px;font-weight:700}
button.s{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.al{border-left:5px solid var(--acc);background:var(--card);padding:10px 12px;margin-bottom:8px;border-radius:8px;border:1px solid var(--line)}
.al.r{border-left-color:var(--red)}
.neg{color:var(--red)}.pos{color:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0;color:var(--mut);font-size:10.5px;font-weight:600}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
nav span{display:block;font-size:18px}
#t{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;display:none;z-index:9;max-width:90%}
</style>
</head>
<body>
<header><b id="ttl">ESPOIR Finance</b><span><button onclick="lock()">🔒</button> <button id="cur" onclick="swap()">FC</button></span></header>
<main id="app"></main>
<div id="t"></div>
<nav id="nav"></nav>
<script>
var DEMO=false,CU=null,S,tab='home',KEY='espoir_v03';
function init(){return{taux:2265,dev:'FC',acc:[{id:'a1',nom:'Caisse',cur:'FC'},{id:'a2',nom:'Caisse',cur:'USD'},{id:'a3',nom:'Mobile Money',cur:'FC'}],p:[],v:[],mv:[],biz:null,fr:[],ac:[],sm:[],us:[],au:[],cl:[],od:[],cs:[]}}
function norm(){S.cs=S.cs||[];S.od=S.od||[];S.us=S.us||[];S.au=S.au||[];S.cl=S.cl||[];S.fr=S.fr||[];S.ac=S.ac||[];S.sm=S.sm||[]}
function db(m,f){try{var r=indexedDB.open(KEY,1);r.onupgradeneeded=function(){r.result.createObjectStore('k')};r.onsuccess=function(){f(r.result.transaction('k',m).objectStore('k'))};r.onerror=function(){f(null)}}catch(e){f(null)}}
function save(){if(DEMO)return;if(!LOADED)return;S._t=Date.now();var j=JSON.stringify(S);db('readwrite',function(s){if(s){s.put(j,'s')}});try{localStorage.setItem(KEY,j)}catch(e){}}
var LOADED=false;
function pj(t){try{var o=JSON.parse(t);return o&&o.mv&&o.p?o:null}catch(e){return null}}
function dk(t){var d=new Date(t||Date.now());return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fin(a,b){
  var A=pj(a),B=pj(b),o=A&&B?((B._t||0)>(A._t||0)?B:A):(A||B);
  S=o||init();norm();LOADED=true;R();
}
function start(){var ls=localStorage.getItem(KEY);db('readonly',function(s){if(!s)return fin(null,ls);var g=s.get('s');g.onsuccess=function(){fin(g.result||null,ls)};g.onerror=function(){fin(null,ls)}})}
function $(i){return document.getElementById(i)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function isToday(t){return new Date(t).toDateString()===new Date().toDateString()}
function fa(m,c){return c==='USD'?(m<0?'-':'')+'$'+Math.abs(m).toLocaleString('fr-FR',{maximumFractionDigits:2}):Math.round(m).toLocaleString('fr-FR')+' FC'}
function fmt(n){return S.dev==='USD'?fa(n/S.taux,'USD'):fa(n,'FC')}
function toast(m){var t=$('t');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2400)}
function swap(){S.dev=S.dev==='FC'?'USD':'FC';save();R()}
function go(t){tab=t;R();window.scrollTo(0,0)}
function acc(id){return S.acc.find(function(a){return a.id===id})}
function lab(a){return a.nom+' ('+a.cur+')'}
function fc(e){return e.cur==='USD'?e.m*e.taux:e.m}
function bal(a){return S.mv.reduce(function(s,e){return e.acc===a.id?s+e.m:s},0)}
function dueA(a){return a.total-(a.pay||0)}
function lock(){CU=null;R()}
function hp(p){var h=5381,t='espoir|'+p+'|v1';for(var r=0;r<800;r++)for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h.toString(36)}
function vPin0(){return'<div class="card"><h2>Protégez votre activité</h2><p class="mut">Créez le code PIN du propriétaire.</p><label>Votre nom</label><input id="p0n" value="'+esc(S.biz&&S.biz.resp||'')+'"><label>Code PIN</label><input id="p0a" type="password" inputmode="numeric" maxlength="6"><label>Confirmer le PIN</label><input id="p0b" type="password" inputmode="numeric" maxlength="6"><button class="b" onclick="savePin0()">Enregistrer</button></div>'}
function savePin0(){
  var n=$('p0n').value.trim(),a=$('p0a').value,b=$('p0b').value;
  if(!n)return toast('Entrez votre nom');
  if(!/^\d{4,6}$/.test(a))return toast('PIN : 4 à 6 chiffres');
  if(a!==b)return toast('Les deux PIN sont différents');
  CU={id:uid(),nom:n,role:'prop',pin:hp(a)};S.us.push(CU);save();tab='home';R();
}
function vLock(){return'<div class="card"><h2>Connexion</h2><label>Utilisateur</label><select id="lu">'+S.us.map(function(u){return'<option value="'+u.id+'">'+esc(u.nom)+' ('+u.role+')</option>'}).join('')+'</select><label>Code PIN</label><input id="lp" type="password" inputmode="numeric" maxlength="6"><button class="b" onclick="login()">Ouvrir</button><button class="s" style="width:100%;margin-top:8px;padding:11px" onclick="askDemo()">Mode démonstration</button></div>'}
function login(){
  var u=S.us.find(function(x){return x.id===$('lu').value});
  if(!u||hp($('lp').value)!==u.pin)return toast('PIN incorrect');
  CU=u;save();tab='home';R();
}
function askDemo(){DEMO=true;CU={id:'demo',nom:'Démonstration',role:'prop'};S=init();norm();S.biz={nom:'Activité Démo',type:'Boutique'};LOADED=true;R();toast('Mode démonstration activé');}
function licBanner(){
  var act=S.v.some(function(v){return isToday(v.t)}),done=S.lx&&isToday(S.lx);
  if(new Date().getHours()>=20&&act&&!done)return'<div class="al r"><b>Sauvegarde du soir.</b> Envoyez le fichier sur votre WhatsApp.<br><button class="s" style="margin-top:8px" onclick="exportFile()">Envoyer ma sauvegarde</button></div>';
  return'';
}
function exportFile(){
  var j=JSON.stringify(S);
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'text/plain'}));a.download='espoir-sauvegarde-'+dk()+'.txt';document.body.appendChild(a);a.click();
}
function stockCard(){
  var c=0,v=0;S.p.forEach(function(p){if(p.svc)return;var q=Math.max(p.qte,0);c+=q*p.cout;v+=q*p.vente});
  return'<div class="card"><h2>Valeur du stock</h2><div class="grid"><div class="k"><div class="mut">Au coût d’achat</div><b>'+fmt(c)+'</b></div><div class="k"><div class="mut">Au prix de vente</div><b>'+fmt(v)+'</b></div></div></div>';
}
function vHome(){
  var cr=0,tre=0,df=0;
  S.v.forEach(function(v){if(!v.annul)cr+=(v.total-(v.pay||0))});
  S.ac.forEach(function(a){df+=dueA(a)});
  S.acc.forEach(function(a){tre+=bal(a)*(a.cur==='USD'?S.taux:1)});
  return licBanner()+
    '<div class="card" onclick="go(\'arg\')"><div class="mut">Argent que j’ai</div><div class="big">'+fmt(tre)+'</div></div>'+
    '<div class="card" onclick="go(\'stock\')"><div class="mut">On me doit / Stock</div><div class="big">'+fmt(cr)+'</div></div>'+
    '<button class="b" style="font-size:20px;padding:18px;margin:0 0 12px" onclick="go(\'sell\')">🛒 Vendre</button>'+stockCard();
}
function vSell(){return'<div class="card"><h2>Vente</h2><p class="mut">Module de vente actif.</p><button class="b" onclick="go(\'home\')">Retour Accueil</button></div>'}
function vStock(){return'<div class="card"><h2>Stock ('+S.p.length+')</h2><button class="b" onclick="go(\'home\')">Retour Accueil</button></div>'}
function vAchats(){return'<div class="card"><h2>Achats</h2><button class="b" onclick="go(\'home\')">Retour Accueil</button></div>'}
function vCmd(){return'<div class="card"><h2>Commandes</h2><button class="b" onclick="go(\'home\')">Retour Accueil</button></div>'}
function vArg(){return'<div class="card"><h2>Caisse et comptes</h2><button class="b" onclick="go(\'home\')">Retour Accueil</button></div>'}
function vMore(){return'<div class="card"><h2>Mon activité</h2><b>'+(S.biz?esc(S.biz.nom):'Mon activité')+'</b><button class="b" onclick="lock()">Verrouiller / Déconnexion</button></div>'}
var TABS=[['home','Accueil','🏠'],['sell','Vendre','🛒'],['stock','Stock','📦'],['ach','Achats','📥'],['cmd','Commandes','📋'],['arg','Caisse','💵'],['more','Plus','⚙️']];
function R(){
  $('ttl').textContent=S&&S.biz?S.biz.nom:'ESPOIR Finance';
  $('cur').textContent=S?S.dev:'FC';
  var A=$('app');
  if(!LOADED){A.innerHTML='<div class="card mut">Chargement...</div>';return}
  if(!CU){A.innerHTML=S.us&&S.us.length?vLock():vPin0();$('nav').innerHTML='';return}
  if(tab==='home')A.innerHTML=vHome();
  else if(tab==='sell')A.innerHTML=vSell();
  else if(tab==='stock')A.innerHTML=vStock();
  else if(tab==='ach')A.innerHTML=vAchats();
  else if(tab==='cmd')A.innerHTML=vCmd();
  else if(tab==='arg')A.innerHTML=vArg();
  else if(tab==='more')A.innerHTML=vMore();
  else{tab='home';A.innerHTML=vHome();}
  $('nav').innerHTML=TABS.map(function(t){return'<button class="'+(t[0]===tab?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');
}
start();
</script>
</body>
</html>
