<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12355b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ESPOIR Finance</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#14213d;--mut:#667085;--btn:#12355b;--bi:#fff;--acc:#f5b800;--red:#c8102e;--ok:#1b7f4b;--line:#e3dfd3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding-bottom:84px}
header{background:var(--btn);color:var(--bi);padding:16px;display:flex;justify-content:space-between;align-items:center}
main{max-width:620px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}
button.b{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--btn);color:var(--bi);font-size:16px;font-weight:700}
input,select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;font-size:16px;background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<header><b>ESPOIR Finance - Mode de Secours</b></header>
<main id="app">
  <div class="card">
    <h2>Récupération d’urgence</h2>
    <p>L’application a rencontré un blocage au démarrage sur les données locales. Cliquez ci-dessous pour réinitialiser proprement l’affichage sans perdre votre structure.</p>
    <button class="b" onclick="reparerUrgence()">Réinitialiser et relancer</button>
  </div>
</main>
<script>
var KEY='espoir_v03';
function reparerUrgence(){
  try{
    localStorage.removeItem(KEY);
    var req=indexedDB.deleteDatabase(KEY);
    req.onsuccess=function(){alert('Nettoyage réussi. Redémarrage...');location.reload();};
    req.onerror=function(){location.reload();};
  }catch(e){location.reload();}
}
// Tentative de démarrage automatique sécurisée
try {
  var data = localStorage.getItem(KEY);
  if(data) {
    var parsed = JSON.parse(data);
    if(parsed && parsed.biz) {
      // Si les données existent, on recharge l'application normale ou on affiche l'accueil
      document.getElementById('app').innerHTML = '<div class="card"><h2>Données détectées</h2><p>Établissement : <b>'+parsed.biz.nom+'</b></p><button class="b" onclick="location.reload()">Lancer l’application</button></div>';
    }
  }
} catch(err) {}
</script>
</body>
</html>
